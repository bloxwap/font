name: Publish to npm

# Publishes @bloxwap/font (packages/npm) at the version in packages/npm/package.json when a GitHub release is
# published, or on demand. The package is assembled from the committed web fonts in apps/docs/public (prepack).
#
# npm trusted publishing does not support self-hosted runners
# (https://docs.npmjs.com/trusted-publishers/). This job authenticates with the
# NPM_TOKEN repository secret instead. That drops OIDC trusted publishing and
# automatic provenance. Add NPM_TOKEN before the next release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Keep npm new enough for the same CLI surface we already validate.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Native static faces and the manifest are generated during prepack.
      # setup-python cannot install on these Mac minis (/Users/runner is not writable).
      - name: Require Homebrew Python 3.13
        working-directory: .
        run: .github/scripts/macos-python313.sh
      - run: python -m pip install 'fonttools[woff,unicode]==4.66.1' 'brotli==1.2.0'

      - name: Check npm CLI
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)" > /dev/null || npm install -g npm@latest

      - name: Determine version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Check authentication even if the version below is already published.
      - name: Verify npm publish authentication
        run: node scripts/check-publish-auth.mjs

      - name: Skip if this version is already on npm
        id: exists
        run: |
          if npm view "@bloxwap/font@${{ steps.version.outputs.value }}" version > /dev/null 2>&1; then
            echo "::notice::@bloxwap/font@${{ steps.version.outputs.value }} is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the package contents
        if: steps.exists.outputs.published != 'true'
        run: npm pack --dry-run

      # --force permits checking an existing version; --dry-run prevents publishing.
      - name: Verify npm publish for an existing version
        if: steps.exists.outputs.published == 'true'
        run: npm publish --dry-run --force --loglevel verbose

      # prepack builds the package; publishConfig.access is public.
      # Token publish does not attach provenance (trusted publishing is unavailable here).
      - name: Publish @bloxwap/font@${{ steps.version.outputs.value }}
        if: steps.exists.outputs.published != 'true'
        run: npm publish --loglevel verbose
