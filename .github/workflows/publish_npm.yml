name: Publish to npm

# Publishes @bloxwap/font and the opt-in native packages at their shared version when a GitHub release is
# published, or on demand. One build uses committed variable web fonts and hash-pinned public release zips.
#
# npm trusted publishing does not support self-hosted runners
# (https://docs.npmjs.com/trusted-publishers/). This job authenticates with the
# NPM_TOKEN repository secret instead. That drops OIDC trusted publishing and
# automatic provenance. Add NPM_TOKEN before the next release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/npm
    env:
      # Public release downloads need no auth; avoid GitHub cache saves.
      BLOXWAP_STATIC_SOURCES_CACHE: ${{ runner.temp }}/font-static-sources-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Keep npm new enough for the same CLI surface we already validate.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Native static faces and the manifest are generated by the shared build.
      # setup-python cannot install on these Mac minis (/Users/runner is not writable).
      - name: Require Homebrew Python 3.13
        working-directory: .
        run: .github/scripts/macos-python313.sh
      - run: python -m pip install 'fonttools[woff,unicode]==4.66.1' 'brotli==1.2.0'

      - name: Check npm CLI
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)" > /dev/null || npm install -g npm@latest

      - name: Determine version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Check authentication even if the version below is already published.
      - name: Verify npm publish authentication
        run: node scripts/check-publish-auth.mjs

      - name: Build and test all font packages
        run: |
          node scripts/build.mjs
          npm test

      - name: Skip if this version is already on npm
        id: exists
        run: |
          if npm view "@bloxwap/font@${{ steps.version.outputs.value }}" version > /dev/null 2>&1; then
            echo "::notice::@bloxwap/font@${{ steps.version.outputs.value }} is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the package contents
        if: steps.exists.outputs.published != 'true'
        run: npm pack --dry-run --ignore-scripts

      # --force permits checking an existing version; --dry-run prevents publishing.
      - name: Verify npm publish for an existing version
        if: steps.exists.outputs.published == 'true'
        run: npm publish --dry-run --force --ignore-scripts --loglevel verbose

      # The shared build above generated all assets; publishConfig.access is public.
      # Token publish does not attach provenance (trusted publishing is unavailable here).
      - name: Publish @bloxwap/font@${{ steps.version.outputs.value }}
        if: steps.exists.outputs.published != 'true'
        run: npm publish --ignore-scripts --loglevel verbose

      - name: Publish opt-in native packages
        run: |
          set -euo pipefail
          for dir in ../native/*; do
            (
              cd "$dir"
              name="$(node -p "require('./package.json').name")"
              version="$(node -p "require('./package.json').version")"
              if npm view "$name@$version" version > /dev/null 2>&1; then
                echo "::notice::$name@$version is already published"
                npm publish --dry-run --force --ignore-scripts --loglevel verbose
              else
                npm pack --dry-run --ignore-scripts
                npm publish --ignore-scripts --loglevel verbose
              fi
            )
          done
