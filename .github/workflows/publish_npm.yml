name: Publish to npm

# Publishes the single @bloxwap/font package, including web and native assets,
# when a GitHub release is published, or on demand.
#
# npm trusted publishing does not support self-hosted runners
# (https://docs.npmjs.com/trusted-publishers/). This job authenticates with the
# inherited NPM_TOKEN organization secret instead. Token publishing does not
# attach automatic provenance.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Public release downloads need no auth; a per-run temp cache avoids GitHub cache saves.
      - name: Static source cache location
        working-directory: .
        run: echo "BLOXWAP_STATIC_SOURCES_CACHE=$RUNNER_TEMP/font-static-sources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      # Keep npm new enough for the same CLI surface we already validate.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Native static faces and the manifest are generated by the shared build.
      # setup-python cannot install on these Mac minis (/Users/runner is not writable).
      - name: Require Homebrew Python 3.13
        working-directory: .
        run: .github/scripts/macos-python313.sh
      - run: python -m pip install 'fonttools[woff,unicode]==4.66.1' 'brotli==1.2.0'

      - name: Check npm CLI
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)" > /dev/null || npm install -g npm@latest

      - name: Determine version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Check authentication even if the version below is already published.
      - name: Verify npm publish authentication
        run: node scripts/check-publish-auth.mjs

      - name: Skip if this version is already on npm
        id: exists
        run: |
          node --input-type=module <<'JS'
          import { appendFile, readFile } from 'node:fs/promises';
          const { name, version } = JSON.parse(await readFile('package.json', 'utf8'));
          // npm view may reuse metadata cached before this version was visible.
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, {
            headers: { 'Cache-Control': 'no-cache' },
            signal: AbortSignal.timeout(30_000),
          });
          if (response.ok) {
            console.log(`::notice::${name}@${version} is already published`);
            await appendFile(process.env.GITHUB_OUTPUT, 'published=true\n');
          } else if (response.status !== 404) {
            throw new Error(`Registry returned HTTP ${response.status}`);
          }
          JS

      - name: Build and test @bloxwap/font
        if: steps.exists.outputs.published != 'true'
        run: |
          node scripts/build.mjs
          npm test

      - name: Check the package contents
        if: steps.exists.outputs.published != 'true'
        run: npm pack --dry-run --ignore-scripts

      # The shared build above generated all assets; publishConfig.access is public.
      # Token publish does not attach provenance (trusted publishing is unavailable here).
      - name: Publish @bloxwap/font@${{ steps.version.outputs.value }}
        if: steps.exists.outputs.published != 'true'
        run: npm publish --ignore-scripts --loglevel verbose

      # npm accepts uploads before its publish-time scan makes them installable.
      # https://github.blog/changelog/2026-07-28-npm-publish-time-malware-scanning-and-dual-use-metadata/
      - name: Wait for npm availability
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { setTimeout } from 'node:timers/promises';
          const { name, version } = JSON.parse(await readFile('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`;
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await fetch(url, {
              headers: { 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(30_000),
            });
            if (response.ok) {
              const published = await response.json();
              if (published.version !== version) throw new Error('Unexpected package version');
              console.log(`${name}@${version} is available on npm.`);
              process.exit(0);
            }
            if (response.status !== 404) throw new Error(`Registry returned HTTP ${response.status}`);
            console.log(`Waiting for ${name}@${version} to become available (${attempt + 1}/60).`);
            await setTimeout(15_000);
          }
          throw new Error(`${name}@${version} is not available yet. Check its npm publish-time scan status.`);
          JS

      # Migrate existing installs after the replacement version is available.
      # Deprecation keeps old releases installable and points users to one package.
      - name: Deprecate the superseded native packages
        run: |
          set -euo pipefail
          for name in @bloxwap/font-native @bloxwap/font-native-arabic @bloxwap/font-native-hebrew @bloxwap/font-native-armenian @bloxwap/font-native-georgian @bloxwap/font-native-jp @bloxwap/font-native-kr @bloxwap/font-native-sc; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}")"
            if [ "$status" = '404' ]; then
              echo "::notice::$name is already absent from npm; skipping deprecation"
              continue
            fi
            if [ "$status" != '200' ]; then
              echo "::error::Cannot check $name (HTTP $status)"
              exit 1
            fi
            npm deprecate "$name@<=0.1.3" 'Use @bloxwap/font@^0.1.4. Native fonts now live at @bloxwap/font/native/<Family> and @bloxwap/font/native/assets/<Family>/<File>.ttf.'
          done
