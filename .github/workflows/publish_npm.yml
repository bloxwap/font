name: Publish to npm

# Publishes @bloxwap/font (packages/npm) at the version in packages/npm/package.json when a GitHub release is
# published, or on demand. The package is assembled from the committed web fonts in apps/docs/public (prepack).
# Uses npm trusted publishing (OIDC, no token): configure bloxwap/font → publish_npm.yml on npmjs.com.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)" > /dev/null || npm install -g npm@latest

      - name: Determine version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: exists
        run: |
          if npm view "@bloxwap/font@${{ steps.version.outputs.value }}" version > /dev/null 2>&1; then
            echo "::notice::@bloxwap/font@${{ steps.version.outputs.value }} is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the package contents
        if: steps.exists.outputs.published != 'true'
        run: npm pack --dry-run

      # prepack builds the package; publishConfig.access is public; trusted publishing attaches provenance.
      - name: Publish @bloxwap/font@${{ steps.version.outputs.value }}
        if: steps.exists.outputs.published != 'true'
        run: npm publish
