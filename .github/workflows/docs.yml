name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "apps/docs/**"
      - "vendor/bloxwap-hig/**"
      - "packages/font/README.md"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
  pull_request:
    paths:
      - "README.md"
      - "apps/docs/**"
      - "vendor/bloxwap-hig/**"
      - "packages/font/README.md"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    # Release scan, parallel with build. Skipped on PRs.
    if: github.event_name != 'pull_request'
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  build:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      # Served from https://bloxwap.github.io/font/. The web fonts and data in apps/docs/public
      # are produced by `bun run fonts:build` and committed with it; the download zips are
      # GitHub Release assets (`bun run fonts:release`).
      NEXT_PUBLIC_BASE_PATH: /font
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run docs:build
      # Deploy only runs on main, so PRs skip the Pages tarball (p50 ~74s).
      # upload-pages-artifact invokes `gtar` on macOS (see docs/ci-runners.md).
      - name: Check GNU tar
        if: github.event_name != 'pull_request'
        run: |
          if ! command -v gtar >/dev/null 2>&1; then
            echo "gtar is required for actions/upload-pages-artifact on macOS. Install Homebrew gnu-tar on the runner (see docs/ci-runners.md)."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/out

  deploy:
    # Security: never run fork PR code on the self-hosted runner.
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build, security]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
