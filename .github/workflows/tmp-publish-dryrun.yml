# TEMPORARY: remove before merge. Validates the Ubuntu publish path on PRs.
name: Temporary Ubuntu publish dry-run

on:
  pull_request:

permissions:
  contents: read

jobs:
  publish-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Public release downloads need no auth; a per-run temp cache avoids GitHub cache saves.
      - name: Static source cache location
        working-directory: .
        run: echo "BLOXWAP_STATIC_SOURCES_CACHE=$RUNNER_TEMP/font-static-sources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      # Node 24 supports the pinned trusted-publishing npm CLI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Native static faces and the manifest are generated by the shared build.
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'fonttools[woff,unicode]==4.66.1' 'brotli==1.2.1'

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.6.1

      - name: Determine version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # PRs have no release tag; version comes from package.json, as in publish_npm.yml.
      # Always build: an existing registry version must not bypass this validation.
      - name: Build and test @bloxwap/font
        run: |
          node scripts/build.mjs
          npm test

      - name: Check the package contents
        run: npm pack --dry-run --ignore-scripts

      # npm dry-run still rejects versions already on the registry.
      - name: Set a unique dry-run version
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          pkg.version = `${pkg.version.split('-')[0]}-dryrun.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`;
          await writeFile('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          JS

      # No credentials or OIDC: dry-run validates packaging without uploading.
      - name: Dry-run publish @bloxwap/font@${{ steps.version.outputs.value }}
        run: npm publish --provenance --ignore-scripts --loglevel verbose --tag dry-run --dry-run
