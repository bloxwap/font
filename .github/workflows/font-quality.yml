name: Font delivery quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: font-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python -m pip install 'fonttools[woff,unicode]==4.66.1' 'brotli==1.2.0'
      - run: node packages/npm/scripts/build.mjs
      - run: npm test --prefix packages/npm
      - run: cd apps/next-fixture && bun run check && bun run build && node check-export.mjs
      - name: Check the packed distribution
        working-directory: packages/npm
        run: npm pack --ignore-scripts --json > packed.json
      - uses: actions/upload-artifact@v6
        with:
          name: font-candidate
          path: |
            packages/npm/*.tgz
            packages/npm/manifest.json
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_BASE_PATH: /font
      NEXT_TELEMETRY_DISABLED: '1'
      DOCS_URL: http://127.0.0.1:43914/font/
      PORT: 43914
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run docs:build
      - run: bun test apps/docs/lib/glyph-text.test.ts
      - run: cd apps/docs && bunx playwright install --with-deps chromium firefox webkit
      - name: Production browser checks
        run: |
          bun run docs:preview > preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$DOCS_URL" > /dev/null; then break; fi
            sleep 1
          done
          cd apps/docs
          # One active page avoids oversubscribing the runner while shaping the full font catalog.
          bunx playwright test --workers=1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docs-test-evidence
          path: |
            apps/docs/test-results
            apps/docs/playwright-report
