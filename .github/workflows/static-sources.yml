name: Static source lock

# Re-download every zip pinned in static-sources.json and check its sha256.
# Also require each released npm version (x.y.z) to have a matching vX.Y.Z tag.
on:
  schedule:
    - cron: "30 4 * * 1"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
  pull_request:
    paths:
      - packages/npm/static-sources.json
      - packages/npm/scripts/static_sources.py
      - .github/workflows/static-sources.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Homebrew Python 3.12
        run: .github/scripts/macos-python.sh
      - name: Verify pinned release assets
        run: python packages/npm/scripts/static_sources.py verify
      - name: Every npm release has a git tag
        run: |
          set -euo pipefail
          python - << 'PY'
          import json, re, subprocess, urllib.request
          with urllib.request.urlopen("https://registry.npmjs.org/@bloxwap/font", timeout=60) as response:
              versions = json.load(response)["versions"]
          releases = [version for version in versions if re.fullmatch(r"\d+\.\d+\.\d+", version)]
          if "0.1.4" not in releases:
              raise SystemExit("npm is missing 0.1.4")
          missing = []
          for version in releases:
              tag = f"v{version}"
              listed = subprocess.check_output(["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}"], text=True)
              if not listed.strip():
                  missing.append(tag)
              else:
                  print(f"{tag} exists")
          if missing:
              raise SystemExit("missing git tags: " + ", ".join(missing))
          PY
