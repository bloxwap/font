name: HIG font ownership

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'hig-drift.json'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/hig-drift.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'hig-drift.json'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/hig-drift.yml'

permissions:
  contents: read

concurrency:
  group: hig-font-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      # Tooling-only pin: the registry packages do not include the scoped CLI.
      # Keep this ref and docs/hig-ownership.md in sync; never copy the checker into Font.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bloxwap/hig
          ref: 0e2394428a3971e677e0a97ef5259ac4ca1ec064
          path: .hig
          sparse-checkout: scripts/drift.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check canonical Font ownership and HIG drift
        run: node .hig/scripts/drift.mjs --root . --config hig-drift.json
      - name: Check owning registry HIG packages and imports
        run: bun run --cwd apps/docs scripts/check-hig-packages.ts
